tagline: Ngọn lửa thiêng và sắc đỏ bên thung lũng sông Lô.
intro: >-
  Giữa những thung lũng quanh sông Lô, người Pà Thẻn giữ ngọn lửa thiêng qua lễ nhảy lửa
  và những bộ váy áo đỏ rực như than hồng.
