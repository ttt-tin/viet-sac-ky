tagline: Bản làng nhà trình tường giữa mây trời Y Tý.
intro: >-
  Ở độ cao 1.000–2.000 m nơi biên giới Tây Bắc, người Hà Nhì dựng nhà trình tường bằng đất,
  khai khẩn ruộng bậc thang và giữ tục nối tên cha qua nhiều đời.
