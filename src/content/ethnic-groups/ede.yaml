tagline: Nhà dài, cồng chiêng trên đất đỏ bazan.
intro: >-
  Trên cao nguyên đất đỏ bazan, người Ê Đê sống trong những ngôi nhà dài của đại gia đình
  mẫu hệ, nơi tiếng cồng chiêng và những câu sử thi được truyền qua nhiều thế hệ.
